<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客户跟进工作台 · 入口</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f3f4f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .card {
      background: #fff; padding: 40px 48px; border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; max-width: 420px; width: 90%;
    }
    h1 { margin: 0 0 12px; font-size: 22px; color: #1a1d24; }
    p { margin: 0 0 24px; color: #6b7280; font-size: 14px; line-height: 1.6; }
    .btn {
      display: inline-block; padding: 12px 28px; border-radius: 10px;
      background: #6d5dd3; color: #fff; text-decoration: none; font-size: 15px;
      transition: opacity .2s;
    }
    .btn:hover { opacity: .9; }
    .note { margin-top: 18px; font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="card">
    <h1>客户跟进工作台</h1>
    <p>本地服务器已启动。点击下方按钮进入工作台，即可正常使用「AI 分析 → 调用 API」功能。</p>
    <a class="btn" href="./客户跟进工作台.html">进入工作台</a>
    <div class="note">如果自动跳转被拦截，请手动点击上方按钮。</div>
  </div>
</body>
</html>
